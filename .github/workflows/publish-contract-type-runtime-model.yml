name: Publish Contract-Type Runtime Model

on:
  workflow_dispatch:

# Note: this workflow publishes a GitHub Release asset in the repository where it
# runs (i.e., `github.repository`). LexNLP downloads release tags from the
# repository configured in `lexnlp.MODELS_REPO`.

permissions:
  contents: read

concurrency:
  group: publish-contract-type-runtime-model-${{ github.repository }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.13"
  MODEL_ARTIFACT_CONSTRAINTS: "constraints/model-artifact-abi.txt"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  # Ensure publish workflows work on forks even if the fork does not host the
  # upstream model/corpus release tags needed for training.
  LEXNLP_MODELS_REPO_SLUG: "LexPredict/lexpredict-lexnlp"
  MODEL_TAG: "pipeline/contract-type/0.2-runtime"
  BASELINE_METRICS: "test_data/model_quality/contract_type_baseline_metrics.json"

jobs:
  build:
    name: Build and Verify Runtime Artifact
    if: ${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          prune-cache: true

      - name: Install artifact and latest dependency stacks
        run: |
          uv venv .venv-artifact --python "${PYTHON_VERSION}"
          uv pip install \
            --python .venv-artifact/bin/python \
            --constraint "${MODEL_ARTIFACT_CONSTRAINTS}" \
            -e .
          uv venv .venv-latest --python "${PYTHON_VERSION}"
          UV_PROJECT_ENVIRONMENT=.venv-latest uv sync --frozen
          uv pip check --python .venv-latest/bin/python
          .venv-latest/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import sys

          expected = Path(".venv-latest").resolve()
          actual = Path(sys.prefix).resolve()
          assert actual == expected, f"uv synced {actual}, expected {expected}"
          for package in (
              "joblib",
              "numpy",
              "pandas",
              "scikit-learn",
              "scipy",
              "threadpoolctl",
          ):
              print(f"{package}=={version(package)}")
          PY

      - name: Train runtime contract-type model with minimum artifact ABI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEXNLP_CONTRACT_TYPE_MODEL_TAG: ${{ env.MODEL_TAG }}
        run: |
          .venv-artifact/bin/python scripts/train_contract_type_model.py \
            --target-tag "${MODEL_TAG}" \
            --force \
            --output-json artifacts/model_training/contract_type_model_training_report.json

      - name: Verify deterministic contract-type model build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .venv-artifact/bin/python scripts/train_contract_type_model.py \
            --target-tag pipeline/contract-type/0.2-reproducibility-check \
            --force \
            --output-json artifacts/model_training/contract_type_model_reproducibility_report.json
          .venv-artifact/bin/python - <<'PY'
          from lexnlp.extract.en.contracts.runtime_model import (
              CONTRACT_TYPE_MODEL_FILENAME,
          )
          from lexnlp.ml.artifact_abi import sha256_file
          from lexnlp.ml.catalog import CATALOG
          import os

          published = CATALOG / os.environ["MODEL_TAG"] / CONTRACT_TYPE_MODEL_FILENAME
          rebuilt = (
              CATALOG
              / "pipeline/contract-type/0.2-reproducibility-check"
              / CONTRACT_TYPE_MODEL_FILENAME
          )
          assert published.read_bytes() == rebuilt.read_bytes(), (
              f"non-reproducible model bytes: "
              f"{sha256_file(published)} != {sha256_file(rebuilt)}"
          )
          print(f"reproducible artifact sha256={sha256_file(published)}")
          PY

      - name: Run contract-type quality gate with minimum artifact ABI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEXNLP_CONTRACT_TYPE_MODEL_TAG: ${{ env.MODEL_TAG }}
        run: |
          .venv-artifact/bin/python scripts/contract_type_quality_gate.py \
            --baseline-tag "${MODEL_TAG}" \
            --candidate-tag "${MODEL_TAG}" \
            --baseline-metrics-json "${BASELINE_METRICS}" \
            --candidate-training-report-json artifacts/model_training/contract_type_model_training_report.json \
            --output-json artifacts/contract_type_quality_gate.minimum.json \
            --max-accuracy-top1-regression 0.0 \
            --max-accuracy-topn-regression 0.0 \
            --max-f1-macro-regression 0.0 \
            --max-f1-weighted-regression 0.0 \
            --max-holdout-accuracy-top1-regression 0.0 \
            --max-holdout-accuracy-topn-regression 0.0 \
            --max-holdout-f1-macro-regression 0.0 \
            --max-holdout-f1-weighted-regression 0.0

      - name: Direct-load model with latest dependencies
        env:
          LEXNLP_CONTRACT_TYPE_MODEL_TAG: ${{ env.MODEL_TAG }}
        run: |
          .venv-latest/bin/python - <<'PY'
          from lexnlp.extract.en.contracts.predictors import ProbabilityPredictorContractType

          predictor = ProbabilityPredictorContractType()
          predictions = predictor.make_predictions(
              "This Employment Agreement is entered into on January 1, 2024.",
              top_n=3,
          )
          assert not predictions.empty
          print(predictions.to_dict())
          PY

      - name: Run contract-type quality gate with latest dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEXNLP_CONTRACT_TYPE_MODEL_TAG: ${{ env.MODEL_TAG }}
        run: |
          .venv-latest/bin/python scripts/contract_type_quality_gate.py \
            --baseline-tag "${MODEL_TAG}" \
            --candidate-tag "${MODEL_TAG}" \
            --baseline-metrics-json "${BASELINE_METRICS}" \
            --candidate-training-report-json artifacts/model_training/contract_type_model_training_report.json \
            --output-json artifacts/contract_type_quality_gate.latest.json \
            --max-accuracy-top1-regression 0.0 \
            --max-accuracy-topn-regression 0.0 \
            --max-f1-macro-regression 0.0 \
            --max-f1-weighted-regression 0.0 \
            --max-holdout-accuracy-top1-regression 0.0 \
            --max-holdout-accuracy-topn-regression 0.0 \
            --max-holdout-f1-macro-regression 0.0 \
            --max-holdout-f1-weighted-regression 0.0

      - name: Locate model file
        id: locate
        run: |
          MODEL_PATH="$(
            .venv-latest/bin/python - <<'PY'
          from lexnlp.extract.en.contracts.runtime_model import (
              CONTRACT_TYPE_MODEL_FILENAME,
          )
          from lexnlp.ml.catalog import CATALOG
          import os

          tag = (os.getenv("MODEL_TAG") or "").strip() or "pipeline/contract-type/0.2-runtime"
          path = CATALOG / tag / CONTRACT_TYPE_MODEL_FILENAME
          print(path)
          PY
          )"
          test -f "${MODEL_PATH}"
          echo "model_path=${MODEL_PATH}" >> "$GITHUB_OUTPUT"

      - name: Verify release bytes against trusted manifest
        env:
          MODEL_PATH: ${{ steps.locate.outputs.model_path }}
        run: |
          .venv-artifact/bin/python - <<'PY'
          import os

          from lexnlp.ml.catalog.download import verify_trusted_asset_file

          trusted = verify_trusted_asset_file(
              os.environ["MODEL_PATH"],
              os.environ["MODEL_TAG"],
          )
          print(
              f"trusted release artifact tag={trusted.tag} "
              f"size={trusted.size} sha256={trusted.sha256}"
          )
          PY

      - name: Stage verified release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-type-runtime-release-asset
          path: ${{ steps.locate.outputs.model_path }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload training + gate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-type-runtime-build
          path: |
            artifacts/model_training/contract_type_model_training_report.json
            artifacts/model_training/contract_type_model_reproducibility_report.json
            artifacts/contract_type_quality_gate.minimum.json
            artifacts/contract_type_quality_gate.latest.json
          if-no-files-found: error

  publish:
    name: Publish Verified Runtime Artifact
    needs: build
    if: ${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    # Upstream should require reviewers and restrict deployment branches for
    # this environment. Forks can use the same workflow without extra secrets.
    environment:
      name: model-release
    steps:
      - name: Load trusted asset metadata from exact commit
        id: trusted_manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_MANIFEST: ${{ runner.temp }}/release_asset_manifest.json
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/lexnlp/ml/catalog/release_asset_manifest.json?ref=${GITHUB_SHA}" \
            > "${TRUSTED_MANIFEST}"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(
              Path(os.environ["TRUSTED_MANIFEST"]).read_text(encoding="utf-8")
          )
          matches = [
              asset
              for asset in manifest.get("assets", ())
              if isinstance(asset, dict) and asset.get("tag") == os.environ["MODEL_TAG"]
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"Expected exactly one trusted manifest entry for {os.environ['MODEL_TAG']!r}"
              )

          trusted = matches[0]
          filename = str(trusted.get("filename", ""))
          size = int(trusted.get("size", 0))
          sha256 = str(trusted.get("sha256", "")).lower()
          if (
              not filename
              or Path(filename).name != filename
              or "/" in filename
              or "\\" in filename
              or "\n" in filename
              or "\r" in filename
          ):
              raise SystemExit("Trusted release filename must be non-empty and path-free")
          if size <= 0:
              raise SystemExit("Trusted release size must be positive")
          if re.fullmatch(r"[0-9a-f]{64}", sha256) is None:
              raise SystemExit("Trusted release SHA-256 is invalid")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"model_filename={filename}\n")
              output.write(f"model_size={size}\n")
              output.write(f"model_sha256={sha256}\n")
          PY

      - name: Download verified release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contract-type-runtime-release-asset
          path: ${{ runner.temp }}/release-asset

      - name: Re-verify staged release asset
        id: release_asset
        env:
          MODEL_FILENAME: ${{ steps.trusted_manifest.outputs.model_filename }}
          MODEL_SHA256: ${{ steps.trusted_manifest.outputs.model_sha256 }}
          MODEL_SIZE: ${{ steps.trusted_manifest.outputs.model_size }}
        run: |
          set -euo pipefail
          ASSET_PATH="${RUNNER_TEMP}/release-asset/${MODEL_FILENAME}"
          mapfile -t STAGED_FILES < <(find "${RUNNER_TEMP}/release-asset" -type f -print)
          if [[ "${#STAGED_FILES[@]}" -ne 1 || "${STAGED_FILES[0]}" != "${ASSET_PATH}" ]]; then
            echo "Expected exactly one staged release asset at ${ASSET_PATH}" >&2
            exit 1
          fi

          ACTUAL_SIZE="$(wc -c < "${ASSET_PATH}")"
          ACTUAL_SHA256="$(sha256sum "${ASSET_PATH}" | cut -d' ' -f1)"
          if [[ "${ACTUAL_SIZE}" != "${MODEL_SIZE}" || "${ACTUAL_SHA256}" != "${MODEL_SHA256}" ]]; then
            echo "Staged release asset differs from the exact-commit trust manifest" >&2
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Create immutable release asset if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSET_PATH: ${{ steps.release_asset.outputs.asset_path }}
          MODEL_FILENAME: ${{ steps.trusted_manifest.outputs.model_filename }}
          MODEL_SHA256: ${{ steps.trusted_manifest.outputs.model_sha256 }}
          MODEL_SIZE: ${{ steps.trusted_manifest.outputs.model_size }}
        run: |
          set -euo pipefail
          if ! gh release view "${MODEL_TAG}" >/dev/null 2>&1; then
            gh release create "${MODEL_TAG}" \
              --title "${MODEL_TAG}" \
              --notes "Runtime-compatible contract-type classifier for LexNLP."
          fi
          if gh release view "${MODEL_TAG}" --json assets --jq '.assets[].name' \
              | grep -Fqx -- "${MODEL_FILENAME}"; then
            EXISTING_DIR="${RUNNER_TEMP}/existing-release-asset"
            mkdir -p "${EXISTING_DIR}"
            gh release download "${MODEL_TAG}" \
              --pattern "${MODEL_FILENAME}" \
              --dir "${EXISTING_DIR}"
            EXISTING_PATH="${EXISTING_DIR}/${MODEL_FILENAME}"
            EXISTING_SIZE="$(wc -c < "${EXISTING_PATH}")"
            EXISTING_SHA256="$(sha256sum "${EXISTING_PATH}" | cut -d' ' -f1)"
            if [[ "${EXISTING_SIZE}" == "${MODEL_SIZE}" && "${EXISTING_SHA256}" == "${MODEL_SHA256}" ]]; then
              echo "Release asset already exists with the verified bytes; nothing to upload."
              exit 0
            fi
            echo "Refusing to replace differing release asset ${MODEL_FILENAME}" >&2
            exit 1
          fi
          gh release upload "${MODEL_TAG}" "${ASSET_PATH}"
