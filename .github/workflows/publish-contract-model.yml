name: Publish Contract Model (is-contract)

on:
  workflow_dispatch:

# Note: this workflow publishes a GitHub Release asset in the repository where it
# runs (i.e., `github.repository`). LexNLP downloads release tags from the
# repository configured via `LEXNLP_MODELS_REPO` / `LEXNLP_MODELS_REPO_SLUG`.

permissions:
  contents: write

concurrency:
  group: publish-contract-model-${{ github.repository }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.13"
  MODEL_ARTIFACT_CONSTRAINTS: "constraints/model-artifact-abi.txt"
  # Ensure publish workflows work on forks even if the fork does not host the
  # upstream model/corpus release tags needed for training/re-export.
  LEXNLP_MODELS_REPO_SLUG: "LexPredict/lexpredict-lexnlp"
  SOURCE_TAG: "pipeline/is-contract/0.1"
  MODEL_TAG: "pipeline/is-contract/0.2"
  BASELINE_METRICS: "test_data/model_quality/is_contract_baseline_metrics.json"

jobs:
  publish:
    name: Publish Re-exported Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          prune-cache: true

      - name: Install artifact and latest dependency stacks
        run: |
          uv venv .venv-artifact --python "${PYTHON_VERSION}"
          uv pip install \
            --python .venv-artifact/bin/python \
            --constraint "${MODEL_ARTIFACT_CONSTRAINTS}" \
            -e .
          uv venv .venv-latest --python "${PYTHON_VERSION}"
          UV_PROJECT_ENVIRONMENT=.venv-latest uv sync --frozen
          uv pip check --python .venv-latest/bin/python
          .venv-latest/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import sys

          expected = Path(".venv-latest").resolve()
          actual = Path(sys.prefix).resolve()
          assert actual == expected, f"uv synced {actual}, expected {expected}"
          for package in (
              "joblib",
              "numpy",
              "pandas",
              "scikit-learn",
              "scipy",
              "threadpoolctl",
          ):
              print(f"{package}=={version(package)}")
          PY

      - name: Re-export contract model with minimum artifact ABI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .venv-artifact/bin/python scripts/reexport_contract_model.py \
            --source-tag "${SOURCE_TAG}" \
            --target-tag "${MODEL_TAG}" \
            --baseline-metrics-json "${BASELINE_METRICS}" \
            --output-metadata-json artifacts/model_reexports/contract-model.metadata.json \
            --skip-quality-gate \
            --force

      - name: Run contract model quality gate with minimum artifact ABI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEXNLP_IS_CONTRACT_MODEL_TAG: ${{ env.MODEL_TAG }}
        run: |
          .venv-artifact/bin/python scripts/model_quality_gate.py \
            --baseline-tag "${SOURCE_TAG}" \
            --candidate-tag "${MODEL_TAG}" \
            --baseline-metrics-json "${BASELINE_METRICS}" \
            --output-json artifacts/model_quality_gate.minimum.json \
            --max-accuracy-regression 0.0 \
            --max-f1-regression 0.0

      - name: Direct-load model with latest dependencies
        env:
          LEXNLP_IS_CONTRACT_MODEL_TAG: ${{ env.MODEL_TAG }}
        run: |
          .venv-latest/bin/python - <<'PY'
          from lexnlp.extract.en.contracts.predictors import ProbabilityPredictorIsContract

          predictor = ProbabilityPredictorIsContract()
          result = predictor.is_contract(
              "This Employment Agreement is entered into on January 1, 2024.",
              return_probability=True,
          )
          assert len(result) == 2
          print(result)
          PY

      - name: Run contract model quality gate with latest dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEXNLP_IS_CONTRACT_MODEL_TAG: ${{ env.MODEL_TAG }}
        run: |
          .venv-latest/bin/python scripts/model_quality_gate.py \
            --baseline-tag "${SOURCE_TAG}" \
            --candidate-tag "${MODEL_TAG}" \
            --baseline-metrics-json "${BASELINE_METRICS}" \
            --output-json artifacts/model_quality_gate.latest.json \
            --max-accuracy-regression 0.0 \
            --max-f1-regression 0.0

      - name: Locate model file
        id: locate
        env:
          LEXNLP_IS_CONTRACT_MODEL_TAG: ${{ env.MODEL_TAG }}
        run: |
          MODEL_PATH="$(
            .venv-latest/bin/python - <<'PY'
          from lexnlp.ml.catalog import get_path_from_catalog
          import os

          tag = (os.getenv("LEXNLP_IS_CONTRACT_MODEL_TAG") or "").strip()
          if not tag:
              raise SystemExit("Missing LEXNLP_IS_CONTRACT_MODEL_TAG")
          print(get_path_from_catalog(tag))
          PY
          )"
          test -f "${MODEL_PATH}"
          echo "model_path=${MODEL_PATH}" >> "$GITHUB_OUTPUT"

      - name: Verify release bytes against trusted manifest
        env:
          MODEL_PATH: ${{ steps.locate.outputs.model_path }}
        run: |
          .venv-artifact/bin/python - <<'PY'
          import os
          from lexnlp.ml.catalog.download import verify_trusted_asset_file

          trusted = verify_trusted_asset_file(
              os.environ["MODEL_PATH"],
              os.environ["MODEL_TAG"],
          )
          print(
              f"trusted release artifact tag={trusted.tag} "
              f"size={trusted.size} sha256={trusted.sha256}"
          )
          PY

      - name: Upload training + gate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-model-reexport
          path: |
            artifacts/model_reexports/*.metadata.json
            artifacts/model_quality_gate.minimum.json
            artifacts/model_quality_gate.latest.json
          if-no-files-found: error

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${MODEL_TAG}" >/dev/null 2>&1; then
            gh release create "${MODEL_TAG}" \
              --title "${MODEL_TAG}" \
              --notes "Runtime re-export of the LexNLP is-contract classifier for modern Python/scikit-learn."
          fi

      - name: Upload model asset to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${MODEL_TAG}" "${{ steps.locate.outputs.model_path }}" --clobber
